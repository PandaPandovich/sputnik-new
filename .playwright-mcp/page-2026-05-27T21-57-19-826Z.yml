  - generic [ref=e227]:
    - heading "Клинику «Спутник» открыли ветеринарные врачи, которые любят животных и умеют их лечить" [level=3] [ref=e228]
    - paragraph [ref=e230]: "Ветеринарная клиника «Спутник» в Москве — современный центр диагностики и лечения животных. Мы оказываем полный спектр ветеринарных услуг: прием ветеринара, анализы, диагностика, хирургические операции, стационар и лечение сложных заболеваний у кошек и собак. Мы помогаем питомцам оставаться здоровыми, а их хозяевам — правильно о них заботиться. Доказательная медицина, гуманный подход, собственная лаборатория."
    - link "Подробнее" [ref=e231] [cursor=pointer]:
      - /url: /
  - heading "Как мы работаем" [level=2] [ref=e234]
  - generic [ref=e264]:
    - generic [ref=e266]:
      - heading "Блог" [level=2] [ref=e267]
      - paragraph [ref=e268]: Советы ветеринаров по лечению, уходу и профилактике заболеваний у кошек и собак
    - generic [ref=e270]:
      - generic [ref=e274]:
        - generic [ref=e275]: 27.05.2026
        - heading "Липидоз печени у кошек" [level=4] [ref=e276]
        - paragraph [ref=e277]: Липидоз печени — это опасное состояние, связанное с избыточным накоплением жира в клетках печени (гепатоцитах). Чаще всего оно развивается у животных с ожирением или при резкой потере веса, а также при нарушениях обмена веществ. Это заболевание требует своевременной диагностики и правильного лечения, поскольку при запущенной стадии может привести к тяжелым осложнениям, включая печеночную недостаточность и гибель.
        - link "Читать статью" [ref=e278] [cursor=pointer]:
          - /url: http://localhost:10008/%d0%bb%d0%b8%d0%bf%d0%b8%d0%b4%d0%be%d0%b7-%d0%bf%d0%b5%d1%87%d0%b5%d0%bd%d0%b8-%d1%83-%d0%ba%d0%be%d1%88%d0%b5%d0%ba
      - generic [ref=e282]:
        - generic [ref=e283]: 27.05.2026
        - heading "Гипертиреоз у кошек" [level=4] [ref=e284]
        - paragraph [ref=e285]: Гипертиреоз у кошек — это одно из наиболее распространенных возрастных заболеваний эндокринной системы, которое встречается преимущественно у пожилых кошек (старше 8-10 лет). Заболевание возникает из-за избыточной выработки гормонов щитовидной железы, что приводит к ускорению метаболизма и развитию состояния, известного как тиреотоксикоз. Если не начать лечение гипертиреоза, это может привести к серьезным осложнениям, включая поражение сердца, почек и других внутренних органов.
        - link "Читать статью" [ref=e286] [cursor=pointer]:
          - /url: http://localhost:10008/%d0%b3%d0%b8%d0%bf%d0%b5%d1%80%d1%82%d0%b8%d1%80%d0%b5%d0%be%d0%b7-%d1%83-%d0%ba%d0%be%d1%88%d0%b5%d0%ba
      - generic [ref=e290]:
        - generic [ref=e291]: 27.05.2026
        - heading "Демодекоз у собак" [level=4] [ref=e292]
        - paragraph [ref=e293]: Демодекоз у собак — это распространенное паразитарное заболевание кожи, вызываемое микроскопическим клещом Demodex canis. Этот клещ является частью нормальной микрофлоры кожи у большинства собак. Однако при ослаблении иммунитета его численность резко возрастает, что приводит к развитию клинических признаков болезни.
        - link "Читать статью" [ref=e294] [cursor=pointer]:
          - /url: http://localhost:10008/%d0%b4%d0%b5%d0%bc%d0%be%d0%b4%d0%b5%d0%ba%d0%be%d0%b7-%d1%83-%d1%81%d0%be%d0%b1%d0%b0%d0%ba
