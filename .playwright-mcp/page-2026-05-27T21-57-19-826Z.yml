              - paragraph [ref=f1e94]:
                - text: В клинику "Спутник" обратились по рекомендации ветврача из ветпункта в Останкино,поскольку у собаки возникли весьма серьёзные проблемы со здоровьем,требующие специального оборудования и высокой квалификации врачей. Имея богатый опыт,ожидал обычного формального отношения...Но! Отношение ветврача Татьяны Шипиловой меня поразило! Впервые встретил ветврача,который к чужому животному отнёсся как к своему. Очень грамотно и обстоятельно была проведена диагностика,доходчиво разъяснены все нюансы,назначено предварительное лечение до консультации невролога и,что важно,во время всех длительных манипуляций собака почти не стрессовала. Теперь продолжим лечиться у невролога. И хочется надеяться,что врач будет примерно таким же. Ну а Татьяне и всему коллективу клиники хочу выразить огромную благодарность и пожелать всего самого лучшего. Ну и,конечно,неоспоримые 5⭐!
