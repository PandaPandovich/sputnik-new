                - listitem [ref=f1e63]
              - paragraph [ref=f1e64]:
                - text: "Прекрасная клиника! Врачи, администраторы, помещение на высоте! Всех питомцев вожу. Всегда спокойна за них. А когда пришлось паллиативную помощь получить, так вообще один из самых важных опытов, который стал одним из самых трогательных в моей жизни. Очень благодарна за мою кошку Лалаге. И она ушла достойно, и меня поддержали все (от врачей до администраторов). Я сама работаю в хосписе и знаю теперь на себе, как это важно.... Кота Филю спасли от уретростомии, которую чуть не сделали в другой клинике. У кота Леона моментально обнаружили абсцесс, который в другой клинике даже не подумали предположить. На моих глазах за минуту нашли как волшебники, его вскрыли и все вылечили. Теперь вожу туда щенка Куки. Почему-то не записываемся к конкретному доктору, поэтому была возможность за несколько лет получить помощь чуть ли не от всех. И всегда на 5 с плюсом. Огромное спасибо вам! А еще очень спокойно от общения онлайн с администраторами. Несмотря на расстояние (ездим с другого конца Москвы), всегда только к вам. Успехов! Все-таки хочу поделиться своим постом, который я писала в день усыпления кошки. (сейчас узнала имя администратора - Наталия) \"Расплатившись с администраторами клиники, я отошла от стойки надеть куртку. Плáчу, постоянно оборачиваюсь на стеклянную дверь кабинета, где сквозь жалюзи на столе вижу оставшуюся Лалаге. Я завернула ее в розовый плед конвертиком… В холле никого из посетителей кроме меня. Девушки осторожно продолжают работать. Это чувствовалось, что именно не хотели задеть мои чувства своей закрутившейся рутиной. У одной из них зазвонил телефон, и она повторяла за кем-то, перепроверяя, наверное, названия медикаментов (что-ли). А вторая еле заметно шикнула ей: «Тише». Меньше секунды, 4 буквы, и такой бальзам на разрывающееся сердце. Я весь день согреваюсь, вспоминая это слово и движение. Я не подала виду, но, уходя, сказала, что, не дай Боже, заболеют, у меня есть ещё Леон и Филя. Филю, оказывается, помнят. А когда по телефону я говорила, что звоню насчёт Лалаге, тоже сразу тон становился ещё теплее, как будто услышала о принцессе: «О! Лалаге, да-да. Как она?» Вообще же очень внимательные и деликатные сотрудники. Сегодняшняя ситуация стала для меня большим уроком. И ещё я всегда обращала внимание на то (и мне это всегда нравилось), что у них нет никакой музыки\""
                - paragraph [ref=f1e65]:
