              - paragraph [ref=f1e79]:
                - text: "Спасли моего кота от неминуемой смерти, которого довела другая ветклиника (Ветскорая 24) до предсмертного состояния, счёт жизни котика шёл уже на часы… Но благодаря рукам специалистов, НАИВЫСШЕГО УРОВНЯ КВАЛИФИКАЦИИ , ветклиники «Спутник», мой котик выжил, и быстро пошёл на поправку ❤️‍🩹 Огромное спасибо хирургам за кропотливую и ювелирную работу 🙏 Шрамов не видно, от слова совсем, как будто и не было операций. Спасибо огромное глав. врачу Светлане Андреевне, за помощь, за заботу 🙏 Спасибо огромное врачам: Ольге Игоревне и Екатерине Сергеевне за понимание, за отличное отношение к котику 🙏 🙏 Спасибо огромное всем, кто был причастен к спасению, и выхаживанию Симбы 🙏🙏🙏❤️❤️❤️"
