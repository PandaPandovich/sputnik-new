    - paragraph [ref=e236]: "Ветеринарная клиника «Спутник» в Москве — современный центр диагностики и лечения животных. Мы оказываем полный спектр ветеринарных услуг: прием ветеринара, анализы, диагностика, хирургические операции, стационар и лечение сложных заболеваний у кошек и собак. Мы помогаем питомцам оставаться здоровыми, а их хозяевам — правильно о них заботиться. Доказательная медицина, гуманный подход, собственная лаборатория."
